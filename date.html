<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Um convite</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,700;1,9..144,600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  /* ─────────── EDITE AQUI (parte 1 de 2): cores ─────────── */
  :root{
    --bg:#22103A;
    --bg-deep:#170A29;
    --paper:#FFE3EA;
    --paper-hi:#FFF5F2;
    --cherry:#D11A54;
    --cherry-deep:#8E0F39;
    --ink-soft:#7C5A72;
    --radius:22px;
  }

  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    min-height:100svh;
    background:radial-gradient(120% 80% at 50% -10%, #3A1B5E 0%, var(--bg) 45%, var(--bg-deep) 100%);
    color:var(--paper);
    font-family:"Space Mono",ui-monospace,monospace;
    display:grid;place-items:center;
    padding:clamp(14px,3vw,40px);
    overflow-x:hidden;
  }

  /* ── ticket grande ── */
  .ticket{
    width:100%;
    max-width:min(92vw, 860px);
    min-height:clamp(560px, 94svh, 1040px);
    display:flex;flex-direction:column;
    background:linear-gradient(180deg,var(--paper-hi),var(--paper));
    color:var(--cherry-deep);
    border-radius:var(--radius);
    box-shadow:0 30px 70px -20px rgba(0,0,0,.7), 0 0 0 1px rgba(209,26,84,.12);
    position:relative;overflow:hidden;
  }
  .top{padding:22px 30px 12px;display:flex;justify-content:flex-end;align-items:baseline;gap:14px}
  .date{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-soft)}

  .perf{position:relative;height:26px;flex:none}
  .perf::before{content:"";position:absolute;left:22px;right:22px;top:50%;border-top:2px dashed rgba(209,26,84,.3)}
  .perf i{position:absolute;top:50%;width:24px;height:24px;border-radius:50%;background:var(--bg);transform:translateY(-50%)}
  .perf i:first-child{left:-12px}
  .perf i:last-child{right:-12px}

  .body{
    flex:1;padding:6px 30px 26px;position:relative;
    display:flex;flex-direction:column;justify-content:center;
  }

  .step{display:none}
  .step.on{display:block;animation:in .38s cubic-bezier(.2,.8,.2,1) both}
  @keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

  .ask{
    font-family:"Fraunces",Georgia,serif;font-weight:700;
    font-size:clamp(28px,6vw,58px);line-height:1.08;
    margin:0 0 10px;color:var(--cherry);letter-spacing:-.01em;
  }
  .hint{font-size:clamp(12.5px,1.4vw,15px);color:var(--ink-soft);margin:0 0 20px;letter-spacing:.05em}

  .arena{position:relative;height:clamp(220px,42svh,380px);margin-top:4px}
  .btn{
    font-family:"Space Mono",monospace;font-weight:700;letter-spacing:.06em;
    border:none;cursor:pointer;border-radius:999px;padding:clamp(22px,3vw,32px) clamp(46px,6vw,68px);font-size:clamp(20px,2.4vw,27px);
    transition:transform .18s cubic-bezier(.2,.8,.2,1), box-shadow .18s;
  }
  .btn:focus-visible{outline:3px solid var(--cherry);outline-offset:3px}
  .yes{
    position:absolute;left:36%;top:50%;transform:translate(-50%,-50%) scale(var(--s,1));
    background:var(--cherry);color:var(--paper-hi);
    box-shadow:0 12px 28px -8px rgba(209,26,84,.75);
  }
  .no{
    position:absolute;left:64%;top:50%;transform:translate(-50%,-50%) scale(var(--ns,1));
    background:transparent;color:var(--ink-soft);
    border:2px solid rgba(124,90,114,.45);
    transition:left .22s cubic-bezier(.34,1.56,.64,1), top .22s cubic-bezier(.34,1.56,.64,1), transform .22s;
  }
  .grid{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin:0 0 20px}
  .opt{
    flex:1 1 200px;max-width:260px;
    display:flex;align-items:center;justify-content:center;gap:12px;text-align:center;
    background:rgba(255,255,255,.55);border:2px solid rgba(209,26,84,.16);
    color:var(--cherry-deep);border-radius:16px;padding:clamp(18px,2.2vw,24px) clamp(16px,2vw,22px);
    font-family:"Space Mono",monospace;font-size:clamp(15px,1.6vw,18px);cursor:pointer;
    transition:border-color .15s,background .15s,transform .15s;
  }
  .opt .ico{font-size:clamp(24px,2.6vw,30px);line-height:1}
  .opt:hover{transform:translateY(-2px);border-color:rgba(209,26,84,.4)}
  .opt[aria-pressed="true"]{background:var(--cherry);color:var(--paper-hi);border-color:var(--cherry)}
  .opt:focus-visible{outline:3px solid var(--cherry);outline-offset:2px}

  .row{display:flex;gap:12px}
  .field{flex:1;margin-bottom:14px}
  label{display:block;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:7px}
  input,textarea{
    width:100%;font-family:"Space Mono",monospace;font-size:17px;
    color:var(--cherry-deep);background:rgba(255,255,255,.6);
    border:2px solid rgba(209,26,84,.18);border-radius:14px;padding:15px;
  }
  textarea{resize:none;height:74px;font-size:14.5px}
  input:focus,textarea:focus{outline:none;border-color:var(--cherry)}
  .chips{display:flex;flex-wrap:wrap;gap:9px;margin:0 0 18px}
  .chip{
    background:transparent;border:1.5px dashed rgba(124,90,114,.5);color:var(--ink-soft);
    border-radius:999px;padding:9px 14px;font-family:"Space Mono",monospace;font-size:12.5px;cursor:pointer;
  }
  .chip:hover{border-color:var(--cherry);color:var(--cherry)}

  .cta{width:100%;background:var(--cherry);color:var(--paper-hi);box-shadow:0 12px 28px -10px rgba(209,26,84,.8)}
  .cta[disabled]{background:rgba(124,90,114,.25);color:rgba(124,90,114,.8);box-shadow:none;cursor:not-allowed}
  .ghost{width:100%;margin-top:10px;background:transparent;color:var(--ink-soft);border:2px solid rgba(124,90,114,.35)}
  .back{
    background:none;border:none;color:var(--ink-soft);font-family:"Space Mono",monospace;
    font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;padding:14px 0 0;
  }

  .stub{padding:14px 30px 26px;display:grid;grid-template-columns:repeat(auto-fit, minmax(140px,1fr));gap:14px 20px;flex:none}
  .cell{border-top:1px solid rgba(209,26,84,.18);padding-top:10px}
  .cell b{display:block;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-soft);font-weight:400}
  .cell span{font-family:"Fraunces",Georgia,serif;font-size:19px;color:var(--cherry-deep)}
  .cell span.empty{font-family:"Space Mono",monospace;font-size:14px;color:rgba(124,90,114,.5)}

  .stamp{
    position:absolute;right:22px;bottom:14px;width:128px;height:128px;border-radius:50%;
    border:2px solid var(--cherry);color:var(--cherry);
    display:grid;place-items:center;text-align:center;
    font-size:11.5px;letter-spacing:.16em;line-height:1.6;text-transform:uppercase;
    transform:rotate(-14deg) scale(.6);opacity:0;
    box-shadow:inset 0 0 0 5px rgba(209,26,84,.12);pointer-events:none;
  }
  .stamp.on{animation:stampIn .5s cubic-bezier(.2,1.5,.4,1) forwards}
  @keyframes stampIn{to{opacity:.85;transform:rotate(-14deg) scale(1)}}

  .heart{position:fixed;bottom:-30px;font-size:24px;pointer-events:none;animation:up 2.6s linear forwards;z-index:5}
  @keyframes up{to{transform:translateY(-110svh) rotate(40deg);opacity:0}}

  .mini-heart{
    position:absolute;font-size:13px;color:var(--paper-hi);pointer-events:none;
    opacity:0;transform:translateY(6px) scale(.4);
    animation:miniHeart .9s ease-out forwards;
  }
  @keyframes miniHeart{
    0%{opacity:0;transform:translateY(8px) scale(.4)}
    30%{opacity:1}
    100%{opacity:0;transform:translateY(-16px) scale(1.15)}
  }

  @media (max-width:400px){
    .top,.body,.stub{padding-left:20px;padding-right:20px}
    .opt{font-size:14px;padding:14px 12px}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important}
    .stamp.on{opacity:.85;transform:rotate(-14deg) scale(1)}
  }
</style>
</head>
<body>

<div class="ticket">
  <div class="top">
    <span class="date" id="date">—</span>
  </div>

  <div class="perf"><i></i><i></i></div>

  <div class="body">
    <section class="step on" id="s1">
      <p class="ask" id="pergunta">Você quer sair comigo?</p>
      <p class="hint">Duas opções. Só uma funciona.</p>
      <div class="arena">
        <button class="btn yes" id="yes">Sim</button>
        <button class="btn no" id="no" tabindex="-1">Não</button>
      </div>
    </section>

    <section class="step" id="s2">
      <p class="ask">E a gente come o quê?</p>
      <p class="hint">Escolhe um. Dá pra trocar depois.</p>
      <div class="grid" id="opcoes"></div>
      <div class="field" id="outroBox" style="display:none">
        <label for="sugestao">Sua sugestão</label>
        <input type="text" id="sugestao" maxlength="60" placeholder="escreve aqui...">
      </div>
      <button class="btn cta" id="toStep3" disabled>Continuar</button>
      <button class="back" id="back2">← voltar</button>
    </section>

    <section class="step" id="s3">
      <p class="ask">Marca o dia e a hora.</p>
      <p class="hint">Você escolhe, eu apareço.</p>
      <div class="chips" id="chips"></div>
      <div class="row">
        <div class="field"><label for="data">Dia</label><input type="date" id="data"></div>
        <div class="field"><label for="hora">Hora</label><input type="time" id="hora" value="20:00"></div>
      </div>
      <div class="field"><label for="recado">Recado (opcional)</label><textarea id="recado" maxlength="140" placeholder="algo curto..."></textarea></div>
      <button class="btn cta" id="fechar" disabled>Confirmar convite</button>
      <button class="back" id="back3">← voltar</button>
    </section>

    <section class="step" id="s4">
      <p class="ask" id="fimTitulo">Fechado.</p>
      <p class="hint" id="fimTexto">Guarda esse ticket.</p>
      <button class="btn cta" id="whats">Mandar no WhatsApp</button>
      <button class="btn ghost" id="copiar">Copiar o convite</button>
    </section>
  </div>

  <div class="perf"><i></i><i></i></div>

  <div class="stub">
    <div class="cell"><b>Rolê</b><span class="empty" id="cRole">a definir</span></div>
    <div class="cell"><b>Dia</b><span class="empty" id="cData">a definir</span></div>
    <div class="cell"><b>Hora</b><span class="empty" id="cHora">a definir</span></div>
    <div class="cell"><b>Companhia</b><span id="cEu">Samuel</span></div>
    <div class="stamp" id="stamp">confirmado</div>
  </div>
</div>

<script>
/* ══════════ EDITE AQUI (parte 2 de 2) ══════════ */
const CONFIG = {
  eu: "Samuel",                         // seu nome (aparece no canhoto)
  pergunta: "Você quer sair comigo?",
  whatsapp: "5515991058639",            // SEU número: 55 + DDD + número, só dígitos
  opcoes: [
    { ico:"🍣", txt:"Sushi" },
    { ico:"🍕", txt:"Pizza" },
    { ico:"🍔", txt:"Hambúrguer" },
    { ico:"🍝", txt:"Italiano" },
    { ico:"☕", txt:"Café e bolo" },
    { ico:"🍦", txt:"Sorvete" },
    { ico:"🌮", txt:"Mexicano" },
    { ico:"🎬", txt:"Cinema" }
  ],
  fugas:["Não"]
};
/* ═══════════════════════════════════════════════ */

const $ = id => document.getElementById(id);
const state = { role:null, data:"", hora:"20:00", recado:"" };

$("cEu").textContent = CONFIG.eu;
$("pergunta").textContent = CONFIG.pergunta;
$("date").textContent = new Date().toLocaleDateString("pt-BR");

function go(n){
  document.querySelectorAll(".step").forEach(s => s.classList.remove("on"));
  $("s"+n).classList.add("on");
}

/* ---------- o botão que foge ---------- */
const no = $("no"), yes = $("yes");
let n = 0;
function dodge(e){
  if(e) e.preventDefault();
  n++;
  const arena = no.parentElement.getBoundingClientRect();
  const w = no.offsetWidth, h = no.offsetHeight;
  const x = Math.random() * Math.max(0, arena.width - w) + w/2;
  const y = Math.random() * Math.max(0, arena.height - h - 24) + h/2;
  no.style.left = x + "px";
  no.style.top = y + "px";
  no.style.setProperty("--ns", Math.max(0.5, 1 - n*0.06));
  yes.style.setProperty("--s", Math.min(1.35, 1 + n*0.05));
  no.textContent = CONFIG.fugas[Math.min(n, CONFIG.fugas.length-1)];
}
no.addEventListener("pointerenter", dodge);
no.addEventListener("touchstart", dodge, {passive:false});
no.addEventListener("click", dodge);
window.addEventListener("pointermove", ev => {
  const r = no.getBoundingClientRect();
  const dx = ev.clientX - (r.left + r.width/2), dy = ev.clientY - (r.top + r.height/2);
  if (Math.hypot(dx, dy) < 82) dodge();
  else{
    yes.style.setProperty("--s", 1);
    no.style.setProperty("--ns", 1);
  }
});

/* ---------- coraçõezinhos no hover do sim ---------- */
let heartTimer = null;
function spawnMiniHeart(){
  const h = document.createElement("span");
  h.className = "mini-heart";
  h.textContent = "❤";
  h.style.left = (12 + Math.random()*76) + "%";
  h.style.top = (15 + Math.random()*70) + "%";
  yes.appendChild(h);
  setTimeout(() => h.remove(), 900);
}
yes.addEventListener("pointerenter", () => {
  spawnMiniHeart();
  heartTimer = setInterval(spawnMiniHeart, 220);
});
yes.addEventListener("pointerleave", () => {
  clearInterval(heartTimer);
});

yes.addEventListener("click", () => {
  if (!matchMedia("(prefers-reduced-motion: reduce)").matches){
    for (let i=0;i<14;i++){
      const s = document.createElement("span");
      s.className = "heart";
      s.textContent = ["❤️","💌","✨","🎟️"][i%4];
      s.style.left = Math.random()*92 + "vw";
      s.style.animationDelay = (Math.random()*0.7) + "s";
      document.body.appendChild(s);
      setTimeout(() => s.remove(), 3600);
    }
  }
  go(2);
});

/* ---------- opções ---------- */
const wrap = $("opcoes");
function selectOpt(btn){
  wrap.querySelectorAll(".opt").forEach(x => x.setAttribute("aria-pressed","false"));
  btn.setAttribute("aria-pressed","true");
}
CONFIG.opcoes.forEach(o => {
  const b = document.createElement("button");
  b.className = "opt"; b.type = "button";
  b.setAttribute("aria-pressed","false");
  b.innerHTML = '<span class="ico">'+o.ico+'</span>'+o.txt;
  b.addEventListener("click", () => {
    selectOpt(b);
    $("outroBox").style.display = "none";
    state.role = o.txt;
    setCell($("cRole"), o.txt);
    $("toStep3").disabled = false;
  });
  wrap.appendChild(b);
});

const outroBtn = document.createElement("button");
outroBtn.className = "opt"; outroBtn.type = "button";
outroBtn.setAttribute("aria-pressed","false");
outroBtn.innerHTML = '<span class="ico">✏️</span>Outro';
outroBtn.addEventListener("click", () => {
  selectOpt(outroBtn);
  $("outroBox").style.display = "block";
  $("sugestao").focus();
  const v = $("sugestao").value.trim();
  state.role = v;
  if(v){ setCell($("cRole"), v); } else { $("cRole").textContent = "a definir"; $("cRole").classList.add("empty"); }
  $("toStep3").disabled = !v;
});
wrap.appendChild(outroBtn);

$("sugestao").addEventListener("input", () => {
  const v = $("sugestao").value.trim();
  state.role = v;
  if(v){ setCell($("cRole"), v); } else { $("cRole").textContent = "a definir"; $("cRole").classList.add("empty"); }
  $("toStep3").disabled = !v;
});

function setCell(el, txt){ el.textContent = txt; el.classList.remove("empty"); }

/* ---------- atalhos de data ---------- */
function proximo(diaSemana){
  const d = new Date();
  d.setDate(d.getDate() + ((diaSemana - d.getDay() + 7) || 7));
  return d.toISOString().slice(0,10);
}
[["Sexta 20h", proximo(5), "20:00"],
 ["Sábado 19h", proximo(6), "19:00"],
 ["Sábado 15h", proximo(6), "15:00"]].forEach(([rot, dia, hora]) => {
  const c = document.createElement("button");
  c.className = "chip"; c.type = "button"; c.textContent = rot;
  c.addEventListener("click", () => { $("data").value = dia; $("hora").value = hora; sync(); });
  $("chips").appendChild(c);
});

const fmt = v => {
  if(!v) return "";
  const [a,m,d] = v.split("-");
  const dt = new Date(+a, +m-1, +d);
  const sem = ["dom","seg","ter","qua","qui","sex","sáb"][dt.getDay()];
  return sem + ", " + d + "/" + m;
};
function sync(){
  state.data = $("data").value;
  state.hora = $("hora").value;
  state.recado = $("recado").value.trim();
  if(state.data) setCell($("cData"), fmt(state.data));
  if(state.hora) setCell($("cHora"), state.hora);
  $("fechar").disabled = !(state.data && state.hora);
}
["data","hora","recado"].forEach(id => $(id).addEventListener("input", sync));
$("data").min = new Date().toISOString().slice(0,10);

$("toStep3").addEventListener("click", () => go(3));
$("back2").addEventListener("click", () => go(1));
$("back3").addEventListener("click", () => go(2));

function texto(){
  return "Convite aceito!\n"
    + "Rolê: " + state.role + "\n"
    + "Quando: " + fmt(state.data) + " às " + state.hora
    + (state.recado ? "\nRecado: " + state.recado : "");
}

$("fechar").addEventListener("click", () => {
  go(4);
  $("stamp").classList.add("on");
  $("fimTitulo").textContent = "Fechado: " + fmt(state.data) + ", " + state.hora + ".";
  $("fimTexto").textContent = state.role + " está anotado. Manda o ticket pra mim pra ficar oficial.";
});
$("whats").addEventListener("click", () => {
  window.open("https://wa.me/" + CONFIG.whatsapp + "?text=" + encodeURIComponent(texto()), "_blank");
});
$("copiar").addEventListener("click", async () => {
  try{
    await navigator.clipboard.writeText(texto());
    $("copiar").textContent = "Copiado";
  }catch(e){
    $("copiar").textContent = "Selecione e copie: " + texto().replace(/\n/g," · ");
  }
  setTimeout(() => { $("copiar").textContent = "Copiar o convite"; }, 2500);
});
</script>
</body>
</html>
